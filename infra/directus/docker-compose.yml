# ============================================================================
#  Studio mb · Calendario Editorial — Infraestructura Directus
# ----------------------------------------------------------------------------
#  Este compose SOLO levanta el contenedor de Directus.
#  La BBDD PostgreSQL y Redis son GLOBALES en el servidor y se accede por
#  alias DNS de los contenedores (postgres / redis) en la red
#  `servicios-internos`. Directus se une ADEMÁS a la red de Nginx Proxy
#  Manager (`nginx-proxy-manager_default`) para ser expuesto públicamente.
# ============================================================================

services:
  directus:
    image: directus/directus:11.5.0
    container_name: studio-mb-directus
    restart: unless-stopped

    # Variables de entorno (ver .env.example)
    env_file:
      - .env

    # Conectado a DOS redes externas que ya existen en el VPS:
    #   - servicios-internos          → resuelve `postgres` y `redis`
    #   - nginx-proxy-manager_default  → resuelve el contenedor desde NPM
    networks:
      servicios-internos:
        aliases:
          - studio-mb-directus
      nginx-proxy-manager_default:
        aliases:
          - studio-mb-directus

    # Healthcheck: comprueba que la API de Directus responde.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    # No publicamos puertos en el host: NPM resolverá por nombre de contenedor.
    expose:
      - "8055"

    # Volumen para uploads. La BBDD es externa, no se monta.
    volumes:
      - directus_uploads:/directus/uploads
      - directus_database:/directus/database

networks:
  servicios-internos:
    external: true
  nginx-proxy-manager_default:
    external: true

volumes:
  directus_uploads:
  directus_database:
